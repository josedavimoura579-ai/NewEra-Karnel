# NEFS - constrói a ISO e a publica como Release do GitHub.
#
# Dispara quando uma tag "nefs-v*" é enviada (ex.: nefs-v0.1). A ISO é
# construída do zero pelo nefs/iso/construir.sh, a partir do código da tag,
# e anexada à Release junto com o seu SHA-256.
name: ISO do NEFS

on:
  push:
    tags:
      - "nefs-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir a ISO
        run: sudo bash nefs/iso/construir.sh

      - name: Conferir a ISO
        run: |
          ISO="$(ls nefs/iso/nefs-*-x86_64.iso)"
          ls -la "$ISO"
          (cd nefs/iso && sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256")
          cat nefs/iso/*.sha256

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${GITHUB_REF_NAME#nefs-v}"
          cat > notas.md <<EOF
          ## NEFS $VERSAO - NovaEra From Scratch

          A ISO para criar o seu próprio sistema operacional sobre o microkernel NovaEra.

          **Como usar** (numa máquina virtual, com pelo menos 1 GiB de RAM):

              qemu-system-x86_64 -cdrom nefs-$VERSAO-x86_64.iso -m 1G

          Dentro dela:

              nefs livro                       # o Livro do NEFS
              nefs novo meu-so "Meu Sistema"   # cria o seu sistema
              cd meu-so
              nefs compilar                    # compila com cproc + QBE
              nefs rodar                       # testa no QEMU
              nefs iso                         # gera a ISO do seu sistema

          **Dentro da ISO:** Linux mínimo (kernel do Ubuntu + BusyBox), cproc + QBE 1.3,
          binutils, nasm, QEMU, GRUB, o comando \`nefs\`, o código do NovaEra e o Livro 1.

          Tudo roda na memória RAM: copie o seu trabalho antes de desligar
          (capítulo 2 do livro).

          O arquivo \`.sha256\` serve para conferir que o download chegou inteiro.
          EOF
          gh release create "$GITHUB_REF_NAME" \
              nefs/iso/nefs-*-x86_64.iso nefs/iso/nefs-*-x86_64.iso.sha256 \
              --title "NEFS $VERSAO" --notes-file notas.md --prerelease
