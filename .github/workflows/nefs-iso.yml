# NEFS - constrói a ISO do NEFS e a publica como Release do GitHub.
#
# O NEFS é a OFICINA, no estilo do Linux From Scratch: uma tela preta com
# comandos e o livro, para montar o seu próprio sistema operacional sobre o
# NovaEra. (O sistema NovaEra pronto, com janelas, tem o lançamento dele:
# .github/workflows/novaera-iso.yml, tags "novaera-v*".)
#
# Dispara quando uma tag "nefs-v*" é criada (ex.: nefs-v0.4), por git push
# ou pela página "Draft a new release" do GitHub. A ISO é construída do
# zero a partir do código da tag e anexada à Release com o SHA-256:
#   nefs-*.iso   a oficina: um Linux mínimo com o compilador, o nefs e o
#                livro (nefs/iso/construir.sh)
name: ISO do NEFS

on:
  push:
    tags:
      - "nefs-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir a ISO do NEFS (a oficina)
        run: sudo bash nefs/iso/construir.sh

      - name: Conferir as ISOs
        run: |
          for ISO in nefs/iso/nefs-*-x86_64.iso; do
              ls -la "$ISO"
              (cd nefs/iso && sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256")
          done
          cat nefs/iso/*.sha256

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${GITHUB_REF_NAME#nefs-v}"
          cat > notas.md <<EOF
          ## NEFS $VERSAO - NovaEra From Scratch

          **A oficina para criar o seu próprio sistema operacional** sobre o
          microkernel NovaEra, no estilo do Linux From Scratch: uma tela preta,
          os comandos e o livro. Você monta o sistema, peça por peça, e vê ele
          nascer.

          (Quer só usar o sistema NovaEra pronto, com janelas? Ele tem o
          lançamento dele: procure "NovaEra" na página de lançamentos.)

          ### nefs-$VERSAO-x86_64.iso

          Pelo menos 1 GiB de RAM:

              qemu-system-x86_64 -cdrom nefs-$VERSAO-x86_64.iso -m 1G

          (No celular, no Termux: acrescente \`-display curses\`.)

          Dentro dela:

              nefs livro                       # o Livro do NEFS: como o NovaEra funciona
              nefs novo meu-so "Meu Sistema"   # cria o seu sistema
              cd meu-so
              nefs compilar                    # compila com cproc + QBE
              nefs rodar                       # testa no QEMU
              nefs iso                         # gera a ISO do seu sistema

          **Dentro da ISO:** Linux mínimo (kernel do Ubuntu + BusyBox), cproc + QBE 1.3,
          nefs-as, nefs-ld e nefs-ar, QEMU, GRUB, o comando \`nefs\`, o código do NovaEra e o Livro 1.

          O livro acompanha cada peça: o núcleo, os servidores, os discos, os
          usuários e, desde a 0.3, a parte gráfica (a tela, o mouse, as letras e
          as janelas): tudo isso vem no código que o seu sistema herda.

          Tudo roda na memória RAM: copie o seu trabalho antes de desligar
          (capítulo 2 do livro).

          O arquivo \`.sha256\` serve para conferir que o download chegou inteiro.
          EOF
          ARQUIVOS="$(ls nefs/iso/nefs-*-x86_64.iso nefs/iso/nefs-*-x86_64.iso.sha256)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              # A Release já existe (criada pela página do GitHub): anexa a
              # ISO e, se a descrição estiver vazia, preenche com estas notas.
              gh release upload "$GITHUB_REF_NAME" $ARQUIVOS --clobber
              if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
                  gh release edit "$GITHUB_REF_NAME" --notes-file notas.md
              fi
          else
              gh release create "$GITHUB_REF_NAME" $ARQUIVOS \
                  --title "NEFS $VERSAO" --notes-file notas.md --prerelease
          fi
