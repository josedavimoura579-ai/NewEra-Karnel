# NovaEra - constrói a ISO do SISTEMA NovaEra e a publica como Release.
#
# O sistema pronto para usar: liga em modo gráfico (janelas, mouse, a tela
# de entrada depois de instalar) e se instala num disco. (A oficina para
# montar o seu próprio sistema é o NEFS: nefs-iso.yml, tags "nefs-v*".)
#
# Dispara quando uma tag "novaera-v*" é criada (ex.: novaera-v4.2), por git
# push ou pela página "Draft a new release" do GitHub.
#   novaera-*.iso   o NovaEra (ferramentas/novaera-iso.sh)
name: ISO do NovaEra

on:
  push:
    tags:
      - "novaera-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir a ISO do NovaEra
        run: sh ferramentas/novaera-iso.sh

      - name: Conferir a ISO
        run: |
          for ISO in build/novaera-*-x86_64.iso; do
              ls -la "$ISO"
              (cd build && sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256")
          done
          cat build/novaera-*.sha256

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="$(sed -n 's/^#define NOVAERA_VERSAO *"\(.*\)".*/\1/p' novaera.h)"
          cat > notas.md <<EOF
          ## NovaEra $VERSAO

          **O sistema operacional NovaEra, pronto para usar:** um microkernel
          x86_64 escrito do zero, com os servidores no anel 3, janelas, mouse e
          letras bonitas. Liga direto pelo CD, em modo gráfico, e se instala num
          disco.

          ### novaera-$VERSAO-x86_64.iso

              truncate -s 256M disco.img
              qemu-system-x86_64 -cdrom novaera-$VERSAO-x86_64.iso -boot d -m 256M \\
                  -drive file=disco.img,format=raw,index=0,media=disk

          No celular (Termux), a tela gráfica vai por VNC: acrescente \`-vnc :1\` e
          conecte um app de VNC (bVNC, RealVNC...) em \`localhost:5901\`. Para ficar em
          texto, no próprio terminal: \`-display curses -vga cirrus\`.

          Dentro dele:

              janelas          # terminais, relógio e calculadora em janelas (Ctrl+Q sai)
              nefs guia        # o Livro 2: instalar no disco, passo a passo (estilo Arch)
              nefs livro       # o Livro 1: como o NovaEra funciona por dentro

          Instalado, ele liga pelo disco numa **tela de entrada gráfica**, com
          usuários e senhas (o login de texto é a 2ª opção do GRUB). Para ligar
          pela ISO com um disco que já tem o NovaEra, use \`-boot d\` no QEMU.

          ### O que ele tem

          Microkernel x86_64 com os servidores no anel 3; sinais e Ctrl+C; até 4
          discos com partições, FAT32 e ext2; usuários, senhas e \`sudo\`; threads,
          memória compartilhada e sockets locais. A parte gráfica: a tela de
          1024 × 768, o mouse (que acompanha o dedo no VNC), fotos PNG/JPEG/BMP
          (\`ver\`), a fonte DejaVu com contorno suave, o servidor de janelas
          (estilo Wayland) com botões e caixas de texto, vários terminais
          gráficos (\`term\`) e a tela de entrada. E compila a si mesmo
          (\`nefs compilar\`): o código-fonte e o compilador vêm dentro.

          ### Quer criar o seu próprio sistema?

          Isso é o **NEFS** (NovaEra From Scratch), a oficina no estilo do Linux
          From Scratch: procure "NEFS" na página de lançamentos.

          O arquivo \`.sha256\` serve para conferir que o download chegou inteiro.
          EOF
          ARQUIVOS="$(ls build/novaera-*-x86_64.iso build/novaera-*-x86_64.iso.sha256)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" $ARQUIVOS --clobber
              if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
                  gh release edit "$GITHUB_REF_NAME" --notes-file notas.md
              fi
          else
              gh release create "$GITHUB_REF_NAME" $ARQUIVOS \
                  --title "NovaEra $VERSAO" --notes-file notas.md --prerelease
          fi
