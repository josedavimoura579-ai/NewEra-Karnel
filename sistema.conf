# ===========================================================================
#  sistema.conf - a identidade do seu sistema operacional
#  É o "os-release" do NovaEra: o núcleo não sabe qual é a distribuição.
#  O build.sh gera build/sistema.h e o arquivo /etc/sistema do initrd (que
#  o novafetch lê). O logo do sistema fica em logo.txt.
#  Acentos são aceitos: a tela VGA usa CP437, e o build converte o que der.
#
#  PURO="sim" quer dizer: este é o NovaEra puro, sem distribuição. Nesse
#  caso a versão mostrada é a do núcleo (novaera.h), e VERSAO não é usada.
#  Um sistema criado com "nefs novo" tem PURO="nao" e a sua própria VERSAO.
# ===========================================================================
NOME="NovaEra Microkernel"
VERSAO=""
LEMA="A Nova Era Começou"
PROMPT="NovaEra"
PURO="sim"
